<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạo yêu cầu vận chuyển</title>
<link rel="stylesheet" href="styles.css">

<style>
body {
    padding: 20px;
    font-family: Arial;
    background: #f5f5f5;
}
.form-box {
    max-width: 650px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}
.form-row {
    margin-bottom: 12px;
}
.form-row label {
    font-weight: bold;
    display: block;
}
.form-row input {
    width: 100%;
    padding: 8px;
    border: 1px solid #bbb;
    border-radius: 6px;
}
.group-title {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #0066ff;
}
button {
    width: 100%;
    padding: 12px;
    background: #0066ff;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #0055cc;
}
.back-btn {
    margin-top: 20px;
    text-align: center;
    font-size: 15px;
    cursor: pointer;
    color: #333;
}
.back-btn:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<h2 style="text-align:center">📝 Tạo yêu cầu vận chuyển</h2>

<div class="form-box">

    <div class="form-row">
        <label>Mã yêu cầu (tự tạo)</label>
        <input id="MaYeuCau" readonly placeholder="(Sẽ tự tạo)">
    </div>

    <div class="group-title">Thông tin người gửi</div>

    <div class="form-row">
        <label>Họ tên người gửi</label>
        <input id="TenNguoiGui">
    </div>

    <div class="form-row">
        <label>Số điện thoại</label>
        <input id="SDTNguoiGui">
    </div>

    <div class="form-row">
        <label>Email</label>
        <input id="EmailNguoiGui">
    </div>

    <div class="form-row">
        <label>Địa chỉ gửi</label>
        <input id="DiaChiGui">
    </div>

    <div class="group-title">Thông tin người nhận</div>

    <div class="form-row">
        <label>Họ tên người nhận</label>
        <input id="TenNguoiNhan">
    </div>

    <div class="form-row">
        <label>Số điện thoại</label>
        <input id="SDTNguoiNhan">
    </div>

    <div class="form-row">
        <label>Email</label>
        <input id="EmailNguoiNhan">
    </div>

    <div class="form-row">
        <label>Địa chỉ nhận</label>
        <input id="DiaChiNhan">
    </div>

    <div class="group-title">Thông tin hàng hóa</div>

    <div class="form-row">
        <label>Loại hàng</label>
        <input id="LoaiHang">
    </div>

    <div class="form-row">
        <label>Khối lượng (kg)</label>
        <input id="KhoiLuong" type="number" step="0.001">
    </div>

    <div class="form-row">
        <label>Giá trị khai báo (VNĐ)</label>
        <input id="GiaTriKhaiBao" type="number">
    </div>

    <div class="form-row">
        <label>Ghi chú</label>
        <input id="GhiChu">
    </div>

    <button onclick="submitRequest()">📩 Gửi yêu cầu</button>

</div>

<div class="back-btn" onclick="window.location.href='index.html'">⬅ Quay lại</div>

<script src="app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("MaYeuCau").value = "YC" + Date.now();
});

async function submitRequest() {

    const payload = {
        MaYeuCau: document.getElementById("MaYeuCau").value,
        TenNguoiGui: document.getElementById("TenNguoiGui").value,
        SDTNguoiGui: document.getElementById("SDTNguoiGui").value,
        EmailNguoiGui: document.getElementById("EmailNguoiGui").value,
        DiaChiGui: document.getElementById("DiaChiGui").value,

        TenNguoiNhan: document.getElementById("TenNguoiNhan").value,
        SDTNguoiNhan: document.getElementById("SDTNguoiNhan").value,
        EmailNguoiNhan: document.getElementById("EmailNguoiNhan").value,
        DiaChiNhan: document.getElementById("DiaChiNhan").value,

        LoaiHang: document.getElementById("LoaiHang").value,
        KhoiLuong: parseFloat(document.getElementById("KhoiLuong").value) || 0,
        GiaTriKhaiBao: parseFloat(document.getElementById("GiaTriKhaiBao").value) || 0,
        GhiChu: document.getElementById("GhiChu").value
    };

    try {
        const res = await fetch(`${API_BASE}/DonYeuCau`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            alert("Lỗi tạo yêu cầu: " + await res.text());
            return;
        }

        alert("🎉 Gửi yêu cầu thành công!");
        window.location.href = "index.html";

    } catch (err) {
        console.error(err);
        alert("Lỗi kết nối API!");
    }
}
</script>

</body>
</html>
